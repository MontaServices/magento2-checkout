<div class="flex-col">
    <div class="flex justify-between space-x-2">
        <div class="flex">
            <img data-bind="attr: {src: deliveryOption.imageUrl}" class="w-16 h-16 pr-2"/>
            <div>
                <p class="font-semibold" text="deliveryOption.shipper"></p>
                <p class="text-sm text-gray-600" text="deliveryOption.displayNameShort"></p>
            </div>
        </div>
        <p class="text-md font-medium" text="deliveryOption.priceFormatted"></p>
    </div>
    <!-- ShipperOptions -->
    <div class="shipperoptions" if="deliveryOption.deliveryOptions.length">
        <p class="font-semibold mb-2">Extra verzendopties:</p>
        <div class="space-y-2" data-bind="foreach: { data: deliveryOption.deliveryOptions, as: 'shipperOption' }">
            <!-- TODO border color should match tile border color -->
            <label class="flex justify-between rounded-tile p-2 monta-gray-tile hover:monta-blue-focus">
                <div class="items-center space-x-2">
                    <input type="checkbox" click="$parents[2].clickShipperOption" data-bind="name: shipperOption.code"/>
                    <span text="shipperOption.description"></span>
                </div>
                <span class="text-md" text="'+' + shipperOption.priceFormatted"></span>
            </label>
        </div>
    </div>
</div>
