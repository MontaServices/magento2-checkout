<div class="flex-col">
    <div class="flex justify-between space-x-2">
        <div class="flex">
            <img data-bind="attr: {src: pickup.imageUrl}" class="pickup-logo w-16 h-16 mr-2">
            <div>
                <strong text="pickup.company"></strong>
                <p class="text-sm text-gray-500" text="pickup.displayName"></p>
                <p class="text-sm text-gray-600"
                   text="pickup.formattedAddress ?? pickup.street + ' ' + pickup.houseNumber"></p>
            </div>
        </div>
        <p class="text-green font-medium" text="pickup.priceFormatted"></p>
    </div>
    <div class="business-hours text-sm text-gray-500 mt-2 hidden" if="pickup.openingTimes.length">
        <div data-bind="foreach: { data: pickup.openingTimes, as: 'slot' }">
            <p class="text-sm flex">
                <span class="w-32 shrink-0" text="slot.day"></span>
                <span text="'\: ' + slot.from + ' - ' + slot.to"></span>
            </p>
        </div>
    </div>
</div>
