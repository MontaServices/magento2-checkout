<div id="block-shipping-options" class="max-w-lg mx-auto"
     if="isSelected">
    <!-- Buttons-->
    <div class="flex mx-auto mb-5"
         data-bind="afterRender: clickFirst, foreach: { data: tabButtons(), as: 'tabButton' }">
        <!-- TODO for some reason Tailwind doesn't work on button element -->
        <button type="button" data-bind="click: tabButton.callback, attr: {id: tabButton.id}"
                if="tabButton.active"
                class="button btn options-tab-button action w-1/2 py-2 text-white mx-auto"
                text="tabButton.label">
        </button>
    </div>
    <div class="tabs">
        <!-- Delivery Options -->
        <div if="DeliveryOptions().length" class="tabcontent hidden"
             data-bind="class: 'tab-' + deliveryOptionsIdentifier">
            <!-- Day buttons -->
            <!-- TODO we could replace all the `afterRender: clickFirst` logic with `.click-first` class like Hyva module in scripts.phtml -->
            <!-- TODO hide day buttons when there is only one (like the Hyva module) -->
            <div class="flex max-w-md mx-auto justify-center gap-5 mb-5"
                 data-bind="afterRender: clickFirst, foreach: { data: DeliveryOptions(), as: 'option' }">
                <!-- $this becomes each element, $parent becomes the current component -->
                <div
                        data-bind="click: $parent.clickDayTile, class: $parent.dayButtonIdentifier"
                        class="flex-col text-center rounded-tile monta-gray-tile hover:monta-blue-focus">
                    <p class="font-semibold py-2" text="day"></p>
                    <p class="text-sm text-gray-500" text="dateFormatted"></p>
                </div>
            </div>
            <!-- Selected day options -->
            <div data-bind="afterRender: clickFirst, foreach: { data: SelectedDateOptions, as: 'deliveryOption' }">
                <div
                        data-bind="click: $parent.clickDeliveryOption, class: $parent.shippingOptionIdentifier"
                        class="rounded-tile monta-gray-tile mb-5 max-w-lg mx-auto"
                        template="name: 'Monta_Checkout/checkout/shipping/components/delivery', data: deliveryOption">
                </div>
            </div>
        </div>
        <!-- Pickup Options TODO move whole tabcontent to childtemplate like in Hyva module -->
        <div if="PickupOptions().length" class="tabcontent hidden space-y-3"
             data-bind="class: 'tab-' + pickupOptionsIdentifier">
            <!-- Attach map to this element-->
            <div class="relative w-full bg-gray-200 overflow-hidden rounded-b-md hidden">
                <div data-bind="attr: {id: mapIdentifier}" class="w-full h-[250px] bg-gray-100"></div>
            </div>
            <!-- List of PickupOptions -->
            <div data-bind="foreach: { data: PickupOptions(), as: 'pickup' }, attr: {id: pickupsIdentifier}"
                 class="space-y-3">
                <div class="rounded-tile monta-gray-tile w-full"
                     data-bind="click: $parent.clickDeliveryOption"
                     template="name: 'Monta_Checkout/checkout/shipping/components/pickup', data: pickup">
                </div>
            </div>
            <!-- Button to switch map or list -->
            <div class="text-center text-blue-500">
                <!-- When in List mode-->
                <div if="!showingMap()" click="toggleMap">
                    <span>&#128205; </span><span data-bind="i18n: 'Map'"></span>
                </div>

                <!-- When in Maps mode -->
                <div if="showingMap()" class="flex items-center justify-between mb-4">
                    <p click="prevPickup">&larr;</p>
                    <div>
                        <p class="text-gray-500" text="listButtonText()"></p>
                        <span>&equiv; </span><span click="toggleMap" data-bind="i18n: 'List'"></span>
                    </div>
                    <p click="nextPickup">&rarr;</p>
                </div>
            </div>
        </div>
    </div>
</div>
